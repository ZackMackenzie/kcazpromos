<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KCAZ — Achadinhos</title>
<meta name="description" content="Achados selecionados e testados pela Kcaz. Encontre pelo código do vídeo." />

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
        },
      },
    },
  };
</script>

<style>
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body { background-color: #000; }
  ::selection { background: #fff; color: #000; }
  /* Scrollbar sutil */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #262626; border-radius: 9999px; border: 2px solid #000; }
  ::-webkit-scrollbar-thumb:hover { background: #404040; }
</style>
</head>

<body class="font-sans bg-black text-neutral-200 antialiased">

  <!-- ======================= HEADER ======================= -->
  <header class="sticky top-0 z-40 border-b border-neutral-800 bg-black/80 backdrop-blur-md">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4 sm:px-6">
      <!-- Logo -->
      <a href="#" class="flex items-center gap-2 shrink-0">
        <span class="text-xl font-bold tracking-[0.18em] text-white">KCAZ</span>
      </a>

      <!-- Badges de contato -->
      <div class="flex items-center gap-2">
        <a
          href="https://wa.me/5599999999999"
          target="_blank"
          rel="noopener"
          class="inline-flex items-center gap-1.5 rounded-full border border-neutral-800 bg-neutral-950 px-3 py-1.5 text-xs font-medium text-neutral-300 transition-colors duration-200 hover:border-neutral-600 hover:text-white"
        >
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 1.67c2.2 0 4.27.86 5.83 2.42a8.2 8.2 0 0 1 2.41 5.82c0 4.54-3.7 8.24-8.25 8.24a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24zm4.52 10.51c-.25-.12-1.47-.72-1.69-.8-.23-.09-.39-.13-.56.12-.16.25-.64.8-.79.97-.14.16-.29.18-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.39.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.16.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43-.14-.01-.31-.01-.47-.01a.9.9 0 0 0-.65.31c-.22.25-.86.84-.86 2.05s.88 2.38 1 2.54c.12.16 1.73 2.64 4.19 3.7.59.25 1.04.4 1.4.52.59.19 1.12.16 1.54.1.47-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.11-.22-.17-.47-.29z"/></svg>
          WhatsApp
        </a>
        <a
          href="https://t.me/seucanal"
          target="_blank"
          rel="noopener"
          class="inline-flex items-center gap-1.5 rounded-full border border-neutral-800 bg-neutral-950 px-3 py-1.5 text-xs font-medium text-neutral-300 transition-colors duration-200 hover:border-neutral-600 hover:text-white"
        >
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.94 4.6 18.9 19.05c-.23 1.01-.83 1.26-1.68.79l-4.64-3.42-2.24 2.15c-.25.25-.46.46-.94.46l.33-4.73L18.6 5.9c.37-.33-.08-.51-.58-.18L6.02 13.4l-4.6-1.44c-1-.31-1.02-1 .21-1.48L20.66 3.2c.83-.31 1.56.2 1.28 1.4z"/></svg>
          Telegram
        </a>
      </div>
    </div>

    <!-- Frase de apoio -->
    <div class="border-t border-neutral-800/60">
      <div class="mx-auto max-w-6xl px-4 py-2.5 sm:px-6">
        <p class="text-center text-[13px] text-neutral-500">
          Achados selecionados e testados. Encontre pelo código do vídeo
          <span class="text-neutral-300">👇</span>
        </p>
      </div>
    </div>
  </header>

  <!-- ======================= MAIN ======================= -->
  <main class="mx-auto max-w-6xl px-4 pb-24 pt-8 sm:px-6">

    <!-- Barra de busca instantânea -->
    <div class="mb-8">
      <div class="relative">
        <svg class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-neutral-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path>
        </svg>
        <input
          id="search"
          type="text"
          autocomplete="off"
          placeholder="Buscar por código (#01) ou nome do produto..."
          class="w-full rounded-lg border border-neutral-800 bg-neutral-950 py-3 pl-11 pr-4 text-sm text-neutral-200 placeholder-neutral-600 outline-none transition-colors duration-200 focus:border-neutral-600"
        />
      </div>
    </div>

    <!-- Grid de produtos -->
    <div id="grid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>

    <!-- Estado vazio -->
    <div id="empty" class="hidden py-24 text-center">
      <p class="text-sm text-neutral-500">Nenhum achadinho encontrado para essa busca.</p>
    </div>
  </main>

  <!-- ======================= FOOTER ======================= -->
  <footer class="border-t border-neutral-800">
    <div class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
      <p class="text-center text-xs text-neutral-600">
        <span class="font-bold tracking-[0.18em] text-neutral-400">KCAZ</span>
        &nbsp;·&nbsp; Descubra, <span class="italic">escolha</span>, Kcaz.
      </p>
      <p class="mt-2 text-center text-[11px] text-neutral-700">
        Os preços podem variar. Alguns links são de afiliado e podem gerar comissão sem custo extra para você.
      </p>
    </div>
  </footer>

  <!-- ======================= SCRIPT ======================= -->
  <script>
    // Formata valor em BRL
    const brl = (v) =>
      v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    // Calcula % de desconto
    const desconto = (antigo, novo) =>
      antigo > novo ? Math.round((1 - novo / antigo) * 100) : 0;

    // Monta o HTML de um card no padrão Vercel Store
    function cardHTML(p) {
      const off = desconto(p.precoAntigo, p.precoNovo);
      return `
        <a
          href="${p.link}"
          target="_blank"
          rel="noopener sponsored"
          class="group flex flex-col overflow-hidden rounded-xl border border-neutral-800 bg-neutral-950 transition-all duration-200 hover:border-neutral-600"
        >
          <!-- Imagem -->
          <div class="relative aspect-square overflow-hidden bg-neutral-900">
            <img
              src="${p.imagem}"
              alt="${p.nome}"
              loading="lazy"
              class="h-full w-full object-cover transition-transform duration-500 ease-out group-hover:scale-105"
            />
            <span class="absolute left-3 top-3 rounded-full border border-neutral-700 bg-black/70 px-2.5 py-1 text-[11px] font-semibold tracking-wide text-white backdrop-blur-sm">
              ${p.codigo}
            </span>
            ${
              off > 0
                ? `<span class="absolute right-3 top-3 rounded-full bg-white px-2.5 py-1 text-[11px] font-semibold text-black">-${off}%</span>`
                : ''
            }
          </div>

          <!-- Info -->
          <div class="flex flex-1 flex-col gap-3 p-4">
            <h3 class="text-sm font-medium leading-snug text-neutral-200 line-clamp-2">
              ${p.nome}
            </h3>

            <div class="mt-auto flex items-end justify-between gap-2">
              <div class="flex flex-col">
                <span class="text-xs text-neutral-600 line-through">${brl(p.precoAntigo)}</span>
                <span class="text-lg font-semibold text-white">${brl(p.precoNovo)}</span>
              </div>
              <span class="inline-flex items-center gap-1 rounded-lg border border-neutral-700 px-3 py-1.5 text-xs font-medium text-neutral-200 transition-colors duration-200 group-hover:border-white group-hover:bg-white group-hover:text-black">
                Comprar
                <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
              </span>
            </div>
          </div>
        </a>
      `;
    }

    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const search = document.getElementById('search');

    // Normaliza texto para busca (remove acento, caixa, #)
    const norm = (s) =>
      (s || '')
        .toString()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')
        .replace(/#/g, '')
        .trim();

    function render(lista) {
      grid.innerHTML = lista.map(cardHTML).join('');
      empty.classList.toggle('hidden', lista.length > 0);
      grid.classList.toggle('hidden', lista.length === 0);
    }

    function filtrar() {
      const q = norm(search.value);
      if (!q) return render(PRODUTOS);
      const res = PRODUTOS.filter(
        (p) => norm(p.codigo).includes(q) || norm(p.nome).includes(q)
      );
      render(res);
    }

    search.addEventListener('input', filtrar);

    // =====================================================
    //  BASE DE DADOS — edite aqui para adicionar/trocar itens
    //  Campos: id | codigo | nome | precoAntigo | precoNovo | link | imagem
    // =====================================================
    const PRODUTOS = [
      {
        id: 1,
        codigo: '#01',
        nome: 'Luminária de Mesa LED com Carregador Sem Fio',
        precoAntigo: 189.9,
        precoNovo: 119.9,
        link: 'https://exemplo-afiliado.com/produto-01',
        imagem: 'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=800&q=80',
      },
      {
        id: 2,
        codigo: '#02',
        nome: 'Fone Bluetooth TWS com Cancelamento de Ruído',
        precoAntigo: 249.0,
        precoNovo: 159.0,
        link: 'https://exemplo-afiliado.com/produto-02',
        imagem: 'https://images.unsplash.com/photo-1590658268037-6bf12165a8df?auto=format&fit=crop&w=800&q=80',
      },
      {
        id: 3,
        codigo: '#03',
        nome: 'Organizador de Bancada em Bambu — Kit 3 Peças',
        precoAntigo: 139.9,
        precoNovo: 89.9,
        link: 'https://exemplo-afiliado.com/produto-03',
        imagem: 'https://images.unsplash.com/photo-1594026112284-02bb6f3352fe?auto=format&fit=crop&w=800&q=80',
      },
      {
        id: 4,
        codigo: '#04',
        nome: 'Garrafa Térmica Inox 500ml — Mantém 12h',
        precoAntigo: 99.9,
        precoNovo: 59.9,
        link: 'https://exemplo-afiliado.com/produto-04',
        imagem: 'https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&w=800&q=80',
      },
    ];

    // Primeira renderização
    render(PRODUTOS);
  </script>
</body>
</html>
